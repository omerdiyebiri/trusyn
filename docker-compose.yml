version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-trusyn}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-trusyn}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      - db
      - redis
    labels:
      - traefik.enable=true
      - traefik.http.routers.trusyn-backend.rule=Host(`api.trusyn.io`)
      - traefik.http.routers.trusyn-backend.entrypoints=http
      - traefik.http.services.trusyn-backend.loadbalancer.server.port=8000
    restart: unless-stopped

  worker:
    build: ./backend
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-trusyn}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  ct_monitor:
    build: ./backend
    command: python app/tasks/ct_monitor.py
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-trusyn}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build: ./frontend
    expose:
      - "3000"
    environment:
      NEXT_PUBLIC_API_URL: https://api.trusyn.io/api/v1
    depends_on:
      - backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.trusyn-frontend.rule=Host(`trusyn.io`)
      - traefik.http.routers.trusyn-frontend.entrypoints=http
      - traefik.http.services.trusyn-frontend.loadbalancer.server.port=3000
    restart: unless-stopped

volumes:
  postgres_data:

version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: trusyn_secure_db_pass_2026
      POSTGRES_DB: trusyn
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:trusyn_secure_db_pass_2026@db:5432/trusyn
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      IMAP_PASSWORD: ${IMAP_PASSWORD}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  worker:
    build: ./backend
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:trusyn_secure_db_pass_2026@db:5432/trusyn
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  ct_monitor:
    build: ./backend
    command: python app/tasks/ct_monitor.py
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:trusyn_secure_db_pass_2026@db:5432/trusyn
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://178.104.229.67:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
